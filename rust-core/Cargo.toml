# This part is already added by cargo init.
[package]
name = "rust_api"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = "0.29.5"
anyhow = "1.0.104"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
log = { version = "0.4", features = ["std"] }
hex = "0.4"
iroh-gossip = "0.101.0"
iroh = "1.0.3"
serde = "1.0.229"
futures-lite = "2.6.1"
thiserror = "2.0.20"
postcard = "1.1.3"
rand = "0.10.2"
n0-error = "1.0.1"
iroh-relay = { version = "1.0.3", default-features = false, features = ["server"], optional = true }

[dev-dependencies]
rust_api = { path = ".", features = ["test-utils"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Enables the Rust-only test harness (see src/harness.rs), which binds against
# a local iroh relay/DNS pair instead of real internet infrastructure.
test-utils = ["iroh/test-utils", "dep:iroh-relay", "iroh-relay/test-utils"]

# This as well.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
